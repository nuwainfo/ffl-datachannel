[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ffl-datachannel"
version = "0.2.2"
description = "aiortc-compatible WebRTC DataChannel subset backed by statically linked libdatachannel and Mbed TLS"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "FastFileLink"}]
dependencies = [
    "pyee>=13.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Communications",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
wheel.packages = ["src/ffl_datachannel"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "native: requires the compiled _ffl_datachannel extension",
]

[tool.scikit-build.sdist]
include = [
    "CMakeLists.txt",
    "README.md",
    ".gitmodules",
    "native/**",
    "src/**",
    "scripts/**",
    "docs/**",
    "patches/**",
    "tests/**",
]
