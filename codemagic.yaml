workflows:
  ffl-datachannel-macos:
    name: ffl-datachannel macOS ARM64 + x86_64
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 16.4

    scripts:
      - name: Prepare macOS runner
        script: |
          set -euo pipefail

          sw_vers
          uname -m
          xcodebuild -version

          sudo softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/uname -m

          brew install cmake ninja pkg-config gnutls git

      - name: Build and test ARM64 wheel
        script: |
          set -euo pipefail

          ARM_CONDA="$HOME/miniconda3"

          if [ ! -x "$ARM_CONDA/bin/conda" ]; then
            curl -fsSL \
              -o /tmp/Miniconda3-arm64.sh \
              https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh

            bash /tmp/Miniconda3-arm64.sh -b -p "$ARM_CONDA"
          fi

          source "$ARM_CONDA/etc/profile.d/conda.sh"

          if ! conda env list | awk '{print $1}' | grep -qx ffl-datachannel-arm64; then
            conda create -y -n ffl-datachannel-arm64 python=3.12
          fi

          conda activate ffl-datachannel-arm64

          export PYTHON="$CONDA_PREFIX/bin/python"
          export ARCH="arm64"
          export MACOSX_DEPLOYMENT_TARGET="15.0"

          unset FFL_DATACHANNEL_GNUTLS_ROOT || true
          unset DYLD_LIBRARY_PATH || true
          unset DYLD_FALLBACK_LIBRARY_PATH || true

          rm -rf out/native-macos artifacts/macos/arm64
          mkdir -p artifacts/macos/arm64

          bash ./scripts/build-macos.sh
          cp out/native-macos/wheel/*.whl artifacts/macos/arm64/

          ARM_WHEEL="$(find artifacts/macos/arm64 -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$ARM_WHEEL"

          python -m pip install --force-reinstall "$ARM_WHEEL"
          python -m pip install pytest pytest-asyncio

          FFL_DATACHANNEL_REQUIRE_NATIVE=1 \
            python -m pytest -q -m native

      - name: Prepare x86_64 toolchain
        script: |
          set -euo pipefail

          X86_CONDA="$HOME/miniconda3-x86_64"
          X86_ENV="$X86_CONDA/envs/ffl-datachannel-x86_64"

          if [ ! -x "$X86_CONDA/bin/conda" ]; then
            curl -fsSL \
              -o /tmp/Miniconda3-x86_64.sh \
              https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-x86_64.sh

            arch -x86_64 /bin/bash /tmp/Miniconda3-x86_64.sh \
              -b \
              -p "$X86_CONDA"
          fi

          if ! arch -x86_64 "$X86_CONDA/bin/conda" env list | awk '{print $1}' | grep -qx ffl-datachannel-x86_64; then
            arch -x86_64 "$X86_CONDA/bin/conda" create -y \
              -n ffl-datachannel-x86_64 \
              -c conda-forge \
              --override-channels \
              python=3.12 \
              wheel \
              cmake \
              ninja \
              pkg-config \
              gnutls
          fi

          arch -x86_64 "$X86_ENV/bin/python" -c \
            'import platform; assert platform.machine() == "x86_64"'

      - name: Build and test x86_64 wheel
        script: |
          set -euo pipefail

          X86_ENV="$HOME/miniconda3-x86_64/envs/ffl-datachannel-x86_64"
          X86_PYTHON="$X86_ENV/bin/python"

          export PATH="$X86_ENV/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          export PYTHON="$X86_PYTHON"
          export ARCH="x86_64"
          export MACOSX_DEPLOYMENT_TARGET="15.0"
          export FFL_DATACHANNEL_GNUTLS_ROOT="$X86_ENV"

          # Do not use DYLD_LIBRARY_PATH here: it can replace Apple's system
          # libiconv with Conda's GNU libiconv.
          unset DYLD_LIBRARY_PATH || true

          # Needed by delocate to resolve Conda's @rpath dependencies.
          export DYLD_FALLBACK_LIBRARY_PATH="$X86_ENV/lib"

          rm -rf out/native-macos artifacts/macos/x86_64
          mkdir -p artifacts/macos/x86_64

          arch -x86_64 /bin/bash ./scripts/build-macos.sh
          cp out/native-macos/wheel/*.whl artifacts/macos/x86_64/

          X86_WHEEL="$(find artifacts/macos/x86_64 -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$X86_WHEEL"

          # delocate may rewrite libunistring to the bundled GNU libiconv.
          # libunistring on macOS must keep using Apple's /usr/lib/libiconv.
          rm -rf /tmp/ffl-datachannel-x86-wheel
          mkdir -p /tmp/ffl-datachannel-x86-wheel
          unzip -q "$X86_WHEEL" -d /tmp/ffl-datachannel-x86-wheel

          DYLIB_DIR="/tmp/ffl-datachannel-x86-wheel/ffl_datachannel/.dylibs"
          WHEEL_UNISTRING="$(find "$DYLIB_DIR" -maxdepth 1 -name 'libunistring*.dylib' -print -quit 2>/dev/null || true)"

          if [ -n "$WHEEL_UNISTRING" ] && \
             otool -L "$WHEEL_UNISTRING" | grep -q '@loader_path/libiconv\.2\.dylib'; then

            install_name_tool \
              -change '@loader_path/libiconv.2.dylib' \
              '/usr/lib/libiconv.2.dylib' \
              "$WHEEL_UNISTRING"

            codesign --force --sign - "$WHEEL_UNISTRING"

            rm -rf /tmp/ffl-datachannel-x86-packed
            mkdir -p /tmp/ffl-datachannel-x86-packed

            arch -x86_64 "$X86_PYTHON" -m wheel pack \
              /tmp/ffl-datachannel-x86-wheel \
              -d /tmp/ffl-datachannel-x86-packed

            rm -f artifacts/macos/x86_64/*.whl
            cp /tmp/ffl-datachannel-x86-packed/*.whl artifacts/macos/x86_64/
          fi

          X86_WHEEL="$(find artifacts/macos/x86_64 -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$X86_WHEEL"

          # Test the finished wheel without any build-only library search path.
          unset DYLD_LIBRARY_PATH || true
          unset DYLD_FALLBACK_LIBRARY_PATH || true
          unset FFL_DATACHANNEL_GNUTLS_ROOT || true

          arch -x86_64 "$X86_PYTHON" -m pip install \
            --force-reinstall \
            "$X86_WHEEL"

          arch -x86_64 "$X86_PYTHON" -m pip install pytest pytest-asyncio

          FFL_DATACHANNEL_REQUIRE_NATIVE=1 \
            arch -x86_64 "$X86_PYTHON" -m pytest -q -m native

      - name: Wheel summary
        script: |
          set -euo pipefail

          find artifacts/macos -type f -name '*.whl' \
            -print \
            -exec shasum -a 256 {} \;

          test "$(find artifacts/macos/arm64 -type f -name '*.whl' | wc -l | tr -d ' ')" = "1"
          test "$(find artifacts/macos/x86_64 -type f -name '*.whl' | wc -l | tr -d ' ')" = "1"

    artifacts:
      - artifacts/macos/arm64/*.whl
      - artifacts/macos/x86_64/*.whl
